name: Build SpeedForce
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Generate custom model resource pack
        run: |
          python3 tools/make_pack.py
          unzip -t dist/ESN-SpeedForce-ResourcePack-1.1.0.zip
      - name: Stage flat install package
        run: |
          mkdir -p release
          cp target/ESN-SpeedForce-1.1.0.jar release/
          cp dist/ESN-SpeedForce-ResourcePack-1.1.0.zip release/
          python3 - <<'PY'
          from pathlib import Path
          assert sorted(p.name for p in Path('release').iterdir()) == ['ESN-SpeedForce-1.1.0.jar', 'ESN-SpeedForce-ResourcePack-1.1.0.zip']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ESN-SpeedForce-Install
          path: release/
          if-no-files-found: error
          retention-days: 90
