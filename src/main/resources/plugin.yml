name: ESNSpeedForce
version: 1.1.0
main: com.esnstudios.speedforce.SpeedForcePlugin
api-version: '1.21.4'
author: ESN Studios
description: Custom speedster suits, rings, Speed Force powers and resource-pack models.
commands:
  speedforce:
    description: ESN SpeedForce control panel and abilities
    aliases: [speedster, sf]
    usage: /speedforce
permissions:
  speedforce.use:
    description: Use equipped SpeedForce suits and abilities
    default: true
  speedforce.admin:
    description: Grant items, configure and reload
    default: op
